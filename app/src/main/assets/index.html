  /* ============================================================
     Batch 8: Sound-Engine v2 (WebAudio-Synth, keine externen Dateien
     -> offline). Fix "kein Sound hörbar":
       a) FREQENZLAGE/PEGEL: Der alte Klangkörper lag bei 195 Hz — kleine
          Laptop-/Phone-Lautsprecher geben so tiefe Frequenzen praktisch
          nicht wieder (der Klang war da, aber hörbar fast nicht vorhanden).
          Neu: Körper 400-560 Hz + Holz-Oberton (~2.76x) + Aufprall-Klick
          2.1-2.6 kHz; ein Limiter erlaubt heißere Pegel ohne Clipping.
       b) AUTOPLAY-POLICY: Der AudioContext muss nach einer Nutzer-Geste
          laufen. Vorher wurde nur in inputUp entsperrt — spielte man
          Schwarz, erzeugte die Engine-Antwort (Worker-Callback, KEINE
          Geste) den Kontext im Zustand "suspended". Jetzt: globaler
          Unlock bei pointerdown/touchend/keydown + iOS-Muster (stiller
          Buffer) direkt nach der Kontext-Erzeugung.
     Klang-Design weiterhin an chess.com/lichess orientiert: trockene,
     hölzerne "Klack"-Sounds (Klick + Klangkörper + Oberton).
     ============================================================ */
  var masterGain = null;
  var _noiseBuf = null;
  function ensureAudio() {
    if (!soundOn) return null;
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 1.0;
        // Batch 8b: SANFTER Sicherheits-Limiter — die 12:1-Variante drückte
        // effektive Spitzen messbar nach unten (Report-Punkt "Limiter zu
        // aggressiv"). Jetzt: nur die obersten ~dB kappen, Transienten fast
        // unangetastet, Gesamtwirkungspegel deutlich höher.
        var limiter = audioCtx.createDynamicsCompressor();
        limiter.threshold.value = -6; limiter.knee.value = 6;
        limiter.ratio.value = 3; limiter.attack.value = 0.002;
        limiter.release.value = 0.12;
        masterGain.connect(limiter);
        limiter.connect(audioCtx.destination);
        // iOS-Unlock-Muster: ein stiller Sample direkt nach der Erzeugung
        try {
          var sb = audioCtx.createBuffer(1, 1, 22050);
          var ss = audioCtx.createBufferSource();
          ss.buffer = sb; ss.connect(audioCtx.destination); ss.start(0);
        } catch (eSilent) {}
      }
      if (audioCtx.state === 'suspended') {
        try {
          var rp = audioCtx.resume();
          if (rp && rp.catch) rp.catch(function(){});   // kein unhandled rejection
        } catch (e2) {}
      }
    } catch (e) { audioCtx = null; masterGain = null; return null; }
    return audioCtx;
  }
  // Batch 8: globaler Audio-Unlock bei der ERSTEN Nutzer-Geste — egal, wo der
  // erste Klang später entsteht (auch wenn die Engine als Schwarzer den ersten
  // Zug spielt, bevor der Nutzer je einen Klang ausgelöst hat). Idempotent.
  (function(){
    function unlock(){ ensureAudio(); }
    document.addEventListener('pointerdown', unlock, true);
    document.addEventListener('touchend', unlock, true);
    document.addEventListener('keydown', unlock, true);
    document.addEventListener('click', unlock, true);   // a11y: synthetische Klicks
  })();
  // iOS/Chrome frieren den Kontext im Hintergrund ein -> beim Zurückkehren
  // sofort wieder wecken, nicht erst beim nächsten Tap.
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) ensureAudio();
  });
  // Batch 8b: Diagnose-Hook für die Browser-Konsole (F12) — die Variablen im
  // IIFE-Closure (soundOn, audioCtx, ensureAudio) sind von außen NICHT
  // erreichbar; dieser Hook macht den Audio-Zustand dennoch prüfbar:
  //   __schachAudio.state()  -> { soundOn, ctxState, ctxTime, master }
  //   __schachAudio.test()   -> Sound an + Test-Klack (auch bei Stumm)
  window.__schachAudio = {
    state: function(){
      return {
        soundOn: soundOn,
        ctxState: audioCtx ? audioCtx.state : null,
        ctxTime: audioCtx ? audioCtx.currentTime : null,
        master: masterGain ? masterGain.gain.value : null
      };
    },
    test: function(){
      soundOn = true;
      try { localStorage.setItem('schach_sound', '1'); } catch (eDbg) {}
      refreshSoundBtn();
      playSound('move');
      return this.state();
    }
  };
  function noiseBuffer() {
    var ctx = audioCtx;
    if (!_noiseBuf) {
      var len = Math.max(1, Math.floor(ctx.sampleRate * 0.15));
      _noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var ch = _noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    }
    return _noiseBuf;
  }
  /* Ein hölzerner "Klack" — drei Bausteine:
     1) Aufprall-Klick: kurzer Rausch-Burst durch Bandpass
     2) Klangkörper: Sinus mit Pitch-Drop 1.5x -> 1x (marimba-artig)
     3) Holz-Oberton (2.76x): macht den Klang auf kleinen Lautsprechern
        überhaupt hörbar — genau das fehlte der v1 (nur 195 Hz).
     Optionaler Tieftöner-Thump für Wiedergabe mit Bässen. */
  function tok(delay, vol, bodyHz, clickHz, bodyDur, opts) {
    var ctx = audioCtx, t0 = ctx.currentTime + (delay || 0);
    opts = opts || {};
    // 1) Aufprall-Klick
    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer();
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = clickHz; bp.Q.value = 1.2;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(vol * (opts.clickVol || 0.85), t0);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + (opts.clickDur || 0.04));
    src.connect(bp); bp.connect(ng); ng.connect(masterGain);
    src.start(t0); src.stop(t0 + (opts.clickDur || 0.04) + 0.03);
    // 2) Holz-Klangkörper
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(bodyHz * 1.5, t0);
    o.frequency.exponentialRampToValueAtTime(bodyHz, t0 + 0.045);
    var og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + bodyDur);
    o.connect(og); og.connect(masterGain);
    o.start(t0); o.stop(t0 + bodyDur + 0.03);
    // 3) Holz-Oberton
    var o2 = ctx.createOscillator();
    o2.type = 'sine'; o2.frequency.value = bodyHz * 2.76;
    var og2 = ctx.createGain();
    og2.gain.setValueAtTime(0.0001, t0);
    og2.gain.exponentialRampToValueAtTime(vol * 0.22, t0 + 0.004);
    og2.gain.exponentialRampToValueAtTime(0.0001, t0 + bodyDur * 0.55);
    o2.connect(og2); og2.connect(masterGain);
    o2.start(t0); o2.stop(t0 + bodyDur * 0.55 + 0.03);
    // 4) Tiefer Thump (nur Schlag/Ende)
    if (opts.thumpHz) {
      var o3 = ctx.createOscillator();
      o3.type = 'sine';
      o3.frequency.setValueAtTime(opts.thumpHz * 1.4, t0);
      o3.frequency.exponentialRampToValueAtTime(opts.thumpHz, t0 + 0.06);
      var og3 = ctx.createGain();
      og3.gain.setValueAtTime(0.0001, t0);
      og3.gain.exponentialRampToValueAtTime(vol * 0.4, t0 + 0.008);
      og3.gain.exponentialRampToValueAtTime(0.0001, t0 + (opts.thumpDur || 0.12));
      o3.connect(og3); og3.connect(masterGain);
      o3.start(t0); o3.stop(t0 + (opts.thumpDur || 0.12) + 0.03);
    }
  }
  function ting(delay, vol, hz, dur) {
    var ctx = audioCtx, t0 = ctx.currentTime + (delay || 0);
    var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = hz;
    var o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = hz * 2.76;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    var g2 = ctx.createGain(); g2.gain.value = 0.22;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.05);
    o2.start(t0); o2.stop(t0 + dur + 0.05);
  }
  function endChime() {
    // Warmes, kurzes Dreiklang-Arpeggio (ergebnisneutral) + tiefer Klack
    var notes = [523.25, 659.26, 783.99];
    for (var i = 0; i < notes.length; i++) {
      var ctx = audioCtx, t0 = ctx.currentTime + i * 0.09;
      var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = notes[i];
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 0.6);
    }
    tok(0, 0.45, 300, 1500, 0.12, { thumpHz: 130, thumpDur: 0.16 });
  }
  function playSound(kind) {
    if (!soundOn) return;
    if (!ensureAudio()) return;
    try {
      if (kind === 'move') { tok(0, 0.6, 540, 2600, 0.12); }
      else if (kind === 'capture') {
        tok(0, 0.72, 400, 2100, 0.17, { clickVol: 1.0, thumpHz: 165, thumpDur: 0.14 });
        tok(0.03, 0.24, 300, 1200, 0.06);
      }
      else if (kind === 'castle') { tok(0, 0.6, 540, 2600, 0.12); tok(0.09, 0.55, 470, 2300, 0.12); }
      else if (kind === 'check') { tok(0, 0.6, 520, 2500, 0.13); ting(0.05, 0.2, 1568, 0.3); }
      else if (kind === 'promote') {
        tok(0, 0.58, 560, 2600, 0.1);
        ting(0.06, 0.16, 1568, 0.24); ting(0.17, 0.12, 2093, 0.22);
      }
      else if (kind === 'end') { endChime(); }
    } catch (e) { /* Audio-Randfälle niemals zum Spielabbruch werden lassen */ }
  }
  function moveFeedback(made) {
    if (!made) return;
    if (game.game_over()) { playSound('end'); return; }
    var f = made.flags || '';
    if (f.indexOf('k') >= 0 || f.indexOf('q') >= 0) { playSound('castle'); return; }  // Rochade: zwei Klacks
    if (game.in_check()) { playSound('check'); return; }
    if (made.promotion) { playSound('promote'); return; }
    if (made.captured) { playSound('capture'); return; }
    playSound('move');
  }

  /* ============================================================
     Batch 6: Schachuhr
     ============================================================ */
  function fmtClock(ms) {
    if (ms < 0) ms = 0;
    if (ms < 20000) return (ms / 1000).toFixed(1);
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function updateClockUI() {
    if (tcBaseMs === 0) return;
    clockTimeWEl.textContent = fmtClock(clockW);
    clockTimeBEl.textContent = fmtClock(clockB);
    var t = game.turn();
    clockWEl.classList.toggle('active', clockActive && t === 'w');
    clockBEl.classList.toggle('active', clockActive && t === 'b');
    clockWEl.classList.toggle('low', clockW < 20000);
    clockBEl.classList.toggle('low', clockB < 20000);
  }
  function clockTick() {
    if (!clockActive || tcBaseMs === 0) return;
    var nowMs = performance.now();
    var dt = nowMs - clockLastTick;
    clockLastTick = nowMs;
    var t = game.turn();
    if (t === 'w') clockW -= dt; else clockB -= dt;
    if (clockW <= 0 || clockB <= 0) {
      if (clockW <= 0) { clockW = 0; flagged = 'w'; } else { clockB = 0; flagged = 'b'; }
      clockActive = false;
      onFlag();
    }
    updateClockUI();
  }
  function clockStart() {
    if (tcBaseMs === 0 || game.game_over() || resigned || flagged) return;
    clockActive = true;
    clockLastTick = performance.now();
    updateClockUI();
  }
  function clockStop() {
    if (!clockActive) return;
    clockActive = false;
    updateClockUI();
  }
  function clockReset() {
    clockW = tcBaseMs; clockB = tcBaseMs;
    clockHistory = [];
    flagged = null;
    clockActive = false;
    updateClockUI();
  }
  function clockOnMove(moverColor) {
    if (tcBaseMs === 0) return;
    clockHistory.push({ w: clockW, b: clockB });
    if (moverColor === 'w') clockW += tcIncMs; else clockB += tcIncMs;
    clockLastTick = performance.now();
    updateClockUI();
  }
  function clockUndo() {
    if (tcBaseMs === 0) return;
    var snap = clockHistory.pop();
    if (snap) { clockW = snap.w; clockB = snap.b; }
    flagged = null;
    updateClockUI();
  }
  function onFlag() {
    gameId++;
    cancelBot();
    closePromo();
    thinking = false;
    selected = null;
    legalTargets = [];
    clearHint();
    updateAll();
    playSound('end');
    showToast(flagged === 'w' ? T('whiteNoTime') : T('blackNoTime'));
  }

  /* ============================================================
     Batch 6: Tipp (Engine antwortet mit hint statt Zug)
     ============================================================ */
  function clearHint() {
    hintFrom = null; hintTo = null;
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  }
  function hintPendingClear() {
    hintBtn.disabled = false;
  }
  function buildPosKeys() {
    // Stellungshistorie für Wiederholungserkennung (per Replay, zustandslos)
    var posKeys = [];
    try {
      var tmpGame = new Chess();
      function pk(f) { var p = f.split(' '); return p[0] + ' ' + p[1] + ' ' + p[2] + ' ' + p[3]; }
      posKeys.push(pk(tmpGame.fen()));
      var histSans = game.history();
      for (var hi = 0; hi < histSans.length; hi++) {
        tmpGame.move(histSans[hi]);
        posKeys.push(pk(tmpGame.fen()));
      }
    } catch (eHist) { return []; }
    return posKeys;
  }
  hintBtn.addEventListener('click', function(){
    if (game.game_over() || resigned || flagged || thinking) {
      showToast(T('noHintNow'));
      return;
    }
    if (!workerUrl) return;
    var w = getWorker();
    if (!w) return;
    var myGameId = gameId;
    var myReq = gameId + '_hint_' + Date.now();
    hintBtn.disabled = true;
    var prevHandler = w.onmessage;
    w.onmessage = function(e) {
      var d = e.data || {};
      if (myGameId !== gameId || d.requestId !== myReq) return; // veraltet/überholt
      w.onmessage = prevHandler;
      hintBtn.disabled = false;
      if (d.hint && d.hint.from) {
        hintFrom = d.hint.from; hintTo = d.hint.to;
        render();
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = setTimeout(function(){ hintFrom = null; hintTo = null; render(); }, 3000);
        setInfo({ depth: d.depth, nodes: 0, elapsed: d.elapsed, score: pvpMode ? null : d.score });
      } else {
        showToast(T('noHint'));
      }
    };
    try {
      w.postMessage({ fen: game.fen(), level: 4, requestId: myReq, histKeys: buildPosKeys(), hint: true });
    } catch (err) {
      w.onmessage = prevHandler;
      hintBtn.disabled = false;
      showToast(T('hintFail'));
    }
  });

  /* ============================================================
     Batch 6: Modus (PvE / PvP), Uhr-Auswahl, Darstellung
     ============================================================ */
  function applyModeUI() {
    levelSectionEl.classList.toggle('disabled', pvpMode);
    colorSectionEl.classList.toggle('disabled', pvpMode);
    resignBtn.disabled = pvpMode;
  }
  modeEl.addEventListener('change', function(){
    var wantPvP = modeEl.value === 'pvp';
    if (wantPvP === pvpMode) return;
    var inProgress = game.history().length > 0 && !game.game_over() && !resigned && !flagged;
    var apply = function () {
      pvpMode = wantPvP;
      applyModeUI();
      newGame(true);
      showToast(pvpMode ? T('modePvpToast') : T('modePveToast'));
    };
    if (inProgress) {
      confirmDialog(T('modeSwitchTitle'), T('modeSwitchConfirm'), apply);
    } else {
      apply();
    }
  });
  tcSelectEl.addEventListener('change', function(){
    var parts = tcSelectEl.value.split('|');
    var base = parseInt(parts[0], 10) || 0;
    var inc = parseInt(parts[1], 10) || 0;
    var inProgress = game.history().length > 0 && !game.game_over() && !resigned && !flagged;
    var apply = function () {
      tcBaseMs = base; tcIncMs = inc;
      try { localStorage.setItem('schach_tc', tcSelectEl.value); } catch (e) {}
      clockBarEl.hidden = tcBaseMs === 0;
      newGame(true);
      showToast(tcBaseMs ? TF('clockToast', tcSelectEl.options[tcSelectEl.selectedIndex].text)
                         : T('clockOffToast'));
    };
    if (inProgress) {
      confirmDialog(T('clockChangeTitle'), T('clockChangeConfirm'), apply);
    } else {
      apply();
    }
  });
  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    try { localStorage.setItem('schach_sound', soundOn ? '1' : '0'); } catch (e) {}
    refreshSoundBtn();
    if (soundOn) {
      // Batch 8b: Bestätigungsklang GARANTIERT hören — läuft der Kontext noch
      // nicht (resume pending), erst nach dem resume() spielen. Ereignisse im
      // suspended-Kontext gehen zwar nicht verloren, aber so erklingt die
      // Bestätigung sofort und nicht beim nächsten Resume-Batch.
      var actx = ensureAudio();
      if (actx && actx.state === 'suspended' && actx.resume) {
        try {
          actx.resume().then(function(){ playSound('promote'); },
                             function(){ playSound('promote'); });
        } catch (eR) { playSound('promote'); }
      } else {
        playSound('promote');
      }
    }
    showToast(soundOn ? T('soundOnToast') : T('soundOffToast'));
  });
  // FIX (Theme-Bug): Das Theme wird JETZT immer direkt aus den Select-Werten
  // angewandt — NICHT mehr durch erneutes Lesen aus localStorage. Vorher wurde
  // bei gesperrtem Speicher (privater Modus, blockiertes file://-Storage) die
  // Auswahl beim Anwenden sofort wieder verworfen: Man wählt "Hell", das Theme
  // springt zurück auf "Dunkel" ("Hell wird nicht angewandt"). Speichern passiert
  // nur noch best-effort; die Sitzung funktioniert auch ohne Storage korrekt.
  function applyTheme(persist) {
    var t = themeSelectEl.value, b = boardSelectEl.value;
    if (t !== 'light' && t !== 'dark') t = 'dark';
    if (['walnut','green','blue'].indexOf(b) < 0) b = 'walnut';
    document.body.classList.toggle('theme-light', t === 'light');
    document.body.classList.remove('board-walnut', 'board-green', 'board-blue');
    document.body.classList.add('board-' + b);
    themeSelectEl.value = t;
    boardSelectEl.value = b;
    if (persist) {
      try {
        localStorage.setItem('schach_theme', t);
        localStorage.setItem('schach_board', b);
      } catch (e) {}
    }
  }
  function loadThemePrefs() {
    var t = 'dark', b = 'walnut';
    try {
      t = localStorage.getItem('schach_theme') || 'dark';
      b = localStorage.getItem('schach_board') || 'walnut';
    } catch (e) {}
    themeSelectEl.value = (t === 'light') ? 'light' : 'dark';
    boardSelectEl.value = (['walnut','green','blue'].indexOf(b) >= 0) ? b : 'walnut';
  }
  themeSelectEl.addEventListener('change', function(){ applyTheme(true); });
  boardSelectEl.addEventListener('change', function(){ applyTheme(true); });

  // Batch 7: Sound-Button-Label (zustandsabhängig, daher nicht via data-i18n)
  function refreshSoundBtn() {
    soundBtn.textContent = soundOn ? T('soundOnLbl') : T('soundOffLbl');
  }

  // Batch 7: Sprachauswahl (Deutsch/English)
  langSelectEl.addEventListener('change', function(){
    lang = (langSelectEl.value === 'en') ? 'en' : 'de';
    try { localStorage.setItem('schach_lang', lang); } catch (e) {}
    applyI18n();
    refreshSoundBtn();
    updateStatus();   // Statuszeile sofort in der neuen Sprache
    showToast(T('langSetToast'));
  });

  // Uhr-Tick (ein Interval für die Laufzeit der App)
  setInterval(clockTick, 100);

  // Tastatur
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      closePromo();
      pgnModalEl.classList.remove('show');
      confirmModalEl.classList.remove('show');
      selected = null; legalTargets = []; render();
    }
    if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); if (e.shiftKey) redoMove(); else undoMove();
    }
    if (e.key === 'f' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      flipped = !flipped; updateAll();
    }
  });

  // Aufräumen
  window.addEventListener('beforeunload', function(){
    cancelBot();
    if (workerUrl) { try { URL.revokeObjectURL(workerUrl); } catch(e) {} }
  });

  /* ============================================================
     Start
     ============================================================ */
  // Standard: Weiß, neue Partie → Mensch ist am Zug
  colorChoice = 'w';
  humanColor = 'w';
  setActiveColorButton('w');
  game = new Chess();

  // Batch 6/7: gespeicherte Einstellungen (Sound, Uhr, Theme, Sprache)
  try { soundOn = localStorage.getItem('schach_sound') !== '0'; } catch (e) {}
  refreshSoundBtn();
  try {
    var tcSaved = localStorage.getItem('schach_tc');
    if (tcSaved && tcSelectEl.querySelector('option[value="' + tcSaved + '"]')) {
      tcSelectEl.value = tcSaved;
      var tcParts = tcSaved.split('|');
      tcBaseMs = parseInt(tcParts[0], 10) || 0;
      tcIncMs = parseInt(tcParts[1], 10) || 0;
    }
  } catch (e) {}
  clockBarEl.hidden = tcBaseMs === 0;
  clockReset();
  // Batch 7: Sprache + Theme in gespeicherter Auswahl anwenden (best-effort persistiert)
  applyI18n();
  langSelectEl.value = lang;
  loadThemePrefs();
  applyTheme(false);
  applyModeUI();
  updateAll();

})();
</script>
</body>
</html>
