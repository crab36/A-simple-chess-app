<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schach – Du gegen die Engine</title>
<style>
  /* ============================================================
     Design Tokens
     ============================================================ */
  :root{
    --bg-0:#0a0e16;
    --bg-1:#10151f;
    --bg-2:#161d2a;
    --bg-3:#1f2837;
    --panel:#171e2b;
    --panel-2:#1d2533;
    --border:rgba(255,255,255,.07);
    --border-strong:rgba(255,255,255,.14);
    --text:#e7ecf3;
    --text-dim:#9aa8bd;
    --text-mute:#6c7a91;
    --accent:#4f9dff;
    --accent-2:#7cc4ff;
    --success:#5fcf80;
    --danger:#ff6b6b;
    --warn:#f0c050;
    --light-sq:#ead9b8;
    --dark-sq:#a87b54;
    --sel:rgba(80,170,255,.55);
    --last:rgba(255,221,87,.45);
    --check:rgba(255,80,80,.65);
    --hint:rgba(20,40,20,.30);
    --hint-cap:rgba(20,40,20,.45);
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 18px 50px rgba(0,0,0,.55);
    --font:"Inter","Segoe UI",-apple-system,system-ui,Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--text);
    background:
      radial-gradient(1100px 700px at 18% -10%, #203049 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #1a2740 0%, transparent 55%),
      linear-gradient(180deg,#0b1018,#070a10);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ============================================================
     Layout
     ============================================================ */
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:18px 18px 28px;
    padding-bottom:calc(28px + env(safe-area-inset-bottom,28px));
  }
  .app-header{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;margin-bottom:18px;
  }
  .app-title{display:flex;align-items:center;gap:12px;font-size:1.25rem;font-weight:700;letter-spacing:.3px}
  .app-title .logo{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(145deg,#4f9dff,#2a6ad4);
    display:grid;place-items:center;font-size:20px;
    box-shadow:0 6px 16px rgba(79,157,255,.35);
  }
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  .top-actions button{width:auto;padding:9px 16px}

  main{
    display:grid;
    grid-template-columns:minmax(0,1fr) 340px;
    gap:22px;
    align-items:start;
  }
  @media(max-width:720px){
    main{grid-template-columns:1fr;gap:14px}
  }

  /* ============================================================
     Board area
     ============================================================ */
  .board-area{
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .captured-row{
    width:min(78vh,640px,calc(100vw - 430px));
    max-width:100%;
    min-height:42px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    padding:6px 12px;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:22px;line-height:1;
  }
  .captured-row .side{
    display:flex;align-items:center;gap:1px;flex:1;min-width:0;
    font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif;
  }
  .captured-row .side.empty{opacity:.35}
  .captured-row .piece-glyph{pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .captured-row .piece-glyph.w{color:#fbfbfb}
  .captured-row .piece-glyph.b{color:#1a1a1a;text-shadow:0 0 1px #000,0 1px 2px rgba(255,255,255,.15)}
  .captured-row .advantage{
    font-family:var(--mono);font-size:.82rem;font-weight:600;
    padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.06);
    color:var(--text);white-space:nowrap;
  }
  .captured-row .advantage.pos{color:var(--success)}
  .captured-row .advantage.neg{color:var(--danger)}

  .board-wrap{
    padding:14px;
    border-radius:var(--radius);
    background:linear-gradient(160deg,var(--frame-a,#3a2f26),var(--frame-b,#1d1612));
    box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.05) inset;
  }
  .board{
    --size:min(78vh,640px,calc(100vw - 430px));
    width:var(--size);height:var(--size);
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    border-radius:8px;overflow:hidden;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-size:calc(var(--size)/8);
    line-height:1;
    position:relative;
    touch-action:none;
  }
  .square{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;min-width:0;min-height:0;overflow:hidden;
    line-height:1;
  }
  .square.light{background:var(--light-sq)}
  .square.dark{background:var(--dark-sq)}
  .square::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    opacity:0;transition:opacity .12s ease;
  }
  .square.last::after{background:var(--last);opacity:1}
  .square.sel::after{background:var(--sel);opacity:1}
  .square.check::after{background:radial-gradient(circle at center,var(--check) 0%,transparent 70%);opacity:1}
  .piece{
    position:relative;z-index:3;
    font-size:.86em;line-height:1;
    font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif;
    pointer-events:none;
    transition:transform .08s ease;
  }
  .piece.w{color:#fbfbfb;text-shadow:1px 1px 0 #2b2b2b,-1px -1px 0 #2b2b2b,1px -1px 0 #2b2b2b,-1px 1px 0 #2b2b2b,0 3px 6px rgba(0,0,0,.45)}
  .piece.b{color:#1a1a1a;text-shadow:0 0 1px #000,1px 1px 0 rgba(255,255,255,.18),0 3px 6px rgba(0,0,0,.35)}
  .piece.dragging{opacity:.4}
  .hint{position:absolute;z-index:2;width:30%;height:30%;border-radius:50%;background:var(--hint);pointer-events:none}
  .hint.capture{width:88%;height:88%;background:transparent;border:.05em solid var(--hint-cap)}
  .coord{
    position:absolute;z-index:2;
    font-size:.15em;font-weight:700;opacity:.7;
    pointer-events:none;font-family:var(--font);line-height:1;
  }
  .coord.rank{top:.18em;left:.22em}
  .coord.file{bottom:.12em;right:.26em}
  .square.dark .coord{color:#f3e6cf}
  .square.light .coord{color:#7a5c3e}

  /* ============================================================
     Side panel
     ============================================================ */
  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:14px;
    position:sticky;top:18px;
  }
  @media(max-width:720px){
    .panel{position:static}
  }
  .panel-section{display:flex;flex-direction:column;gap:7px}
  .panel label{
    font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--text-mute);font-weight:600;
  }

  .status{
    min-height:46px;
    display:flex;align-items:center;gap:10px;
    padding:11px 13px;border-radius:var(--radius-sm);
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    font-size:.92rem;line-height:1.3;
  }
  .status.win{color:var(--success);border-color:rgba(95,207,128,.35);background:rgba(95,207,128,.08)}
  .status.lose{color:var(--danger);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
  .status.draw{color:var(--warn);border-color:rgba(240,192,80,.35);background:rgba(240,192,80,.08)}
  .status .dot{
    width:9px;height:9px;border-radius:50%;background:var(--accent);
    flex:0 0 auto;display:none;
  }
  .status.thinking .dot{display:block;animation:pulse 1.1s infinite ease-in-out}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.2)}}

  .info-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
    font-family:var(--mono);font-size:.78rem;
  }
  .info-cell{
    padding:7px 9px;border-radius:7px;
    background:rgba(0,0,0,.22);border:1px solid var(--border);
  }
  .info-cell .k{color:var(--text-mute);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em}
  .info-cell .v{color:var(--text);font-weight:600;margin-top:2px}
  .info-cell .v.pos{color:var(--success)}
  .info-cell .v.neg{color:var(--danger)}

  .color-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .color-picker button{
    padding:9px 6px;font-size:.84rem;border-radius:8px;
    background:#222b3c;border:1px solid var(--border);color:var(--text);
    cursor:pointer;transition:.15s;font-family:inherit;
  }
  .color-picker button:hover{background:#2a3547;border-color:var(--border-strong)}
  .color-picker button.active{
    background:linear-gradient(180deg,#2f7cf6,#215ec4);
    border-color:#2f7cf6;color:#fff;font-weight:600;
  }

  select,button{
    font:inherit;width:100%;padding:10px 12px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:#222b3c;color:var(--text);
    cursor:pointer;transition:.15s;font-family:inherit;
    touch-action:manipulation;
  }
  select:hover,button:hover{background:#2a3547;border-color:var(--border-strong)}
  select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button:active{transform:translateY(1px)}
  button.primary{
    background:linear-gradient(180deg,#2f7cf6,#215ec4);
    border-color:#2f7cf6;font-weight:600;
  }
  button.primary:hover{background:linear-gradient(180deg,#3c88ff,#2a6ad4)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  button.ghost{background:transparent}

  .btn-row{display:flex;gap:8px}
  .btn-row button{padding:9px 8px;font-size:.85rem}
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn-grid button{padding:9px 8px;font-size:.85rem}

  .moves{
    height:170px;overflow-y:auto;border-radius:var(--radius-sm);
    background:rgba(0,0,0,.28);border:1px solid var(--border);
    padding:6px;font-size:.85rem;font-family:var(--mono);
  }
  .moves::-webkit-scrollbar{width:8px}
  .moves::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  .mv-row{
    display:grid;grid-template-columns:34px 1fr 1fr;gap:4px;
    padding:3px 5px;border-radius:6px;
  }
  .mv-row:nth-child(odd){background:rgba(255,255,255,.03)}
  .mv-row.current{background:rgba(79,157,255,.22);outline:1px solid rgba(79,157,255,.4)}
  .mv-num{color:var(--text-mute)}
  .mv{color:var(--text);cursor:default}
  .mv.empty{color:var(--text-mute)}

  /* ============================================================
     Modals
     ============================================================ */
  .modal{
    position:fixed;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(5,8,12,.72);backdrop-filter:blur(4px);
    z-index:60;padding:20px;
  }
  .modal.show{display:flex}
  .modal-box{
    background:var(--panel);border:1px solid var(--border-strong);
    border-radius:var(--radius);padding:22px 24px;
    box-shadow:0 30px 70px rgba(0,0,0,.6);
    max-width:420px;width:100%;
  }
  .modal-box h3{margin:0 0 12px;font-size:1.05rem}
  .modal-box p{margin:0 0 14px;font-size:.88rem;color:var(--text-dim);line-height:1.5}
  .promo-row{display:flex;gap:10px;justify-content:center}
  .promo-btn{
    width:68px;height:68px;font-size:40px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    background:var(--light-sq);color:#1a1a1a;
    border:2px solid transparent;border-radius:12px;padding:0;
    font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif;
  }
  .promo-btn:hover{background:#fff;border-color:var(--accent)}
  .pgn-textarea{
    width:100%;min-height:160px;resize:vertical;
    padding:10px;border-radius:8px;
    background:#0e131c;border:1px solid var(--border);
    color:var(--text);font-family:var(--mono);font-size:.82rem;
    margin-bottom:12px;
  }
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .modal-actions button{width:auto;padding:9px 16px}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:rgba(20,26,38,.95);border:1px solid var(--border-strong);
    color:var(--text);padding:11px 18px;border-radius:10px;
    font-size:.88rem;z-index:80;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  /* ============================================================
     Batch 6: Uhr, Tipp-Markierung, Themen, Brett-Paletten
     ============================================================ */
  .clocks{display:flex;gap:8px}
  .clock{
    flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 12px;border-radius:var(--radius-sm);
    background:rgba(0,0,0,.22);border:1px solid var(--border);
    font-family:var(--mono);
  }
  .clock .clock-label{
    font-size:.66rem;color:var(--text-mute);text-transform:uppercase;
    letter-spacing:.08em;font-family:var(--font);font-weight:600;
  }
  .clock .clock-time{font-size:1.02rem;font-weight:700}
  .clock.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .clock.low .clock-time{color:var(--danger)}
  .square.hint-move{box-shadow:inset 0 0 0 3px var(--accent)}
  .theme-row{display:flex;gap:8px}
  .theme-row select{flex:1}
  .panel-section.disabled{opacity:.45;pointer-events:none}

  /* Brett-Paletten: Brett + Rahmen über Variablen */
  body.board-walnut{--light-sq:#ead9b8;--dark-sq:#a87b54;--frame-a:#3a2f26;--frame-b:#1d1612}
  body.board-green{--light-sq:#eef0d5;--dark-sq:#77956a;--frame-a:#3f4c39;--frame-b:#232b20}
  body.board-blue{--light-sq:#dfe8f0;--dark-sq:#6b8cab;--frame-a:#3c4a58;--frame-b:#222c36}

  /* Helles Theme (überschreibt die dunklen Hardcodierungen) */
  body.theme-light{
    color-scheme:light;
    --panel:#ffffff;--panel-2:#f2f5f9;
    --border:rgba(15,25,40,.12);--border-strong:rgba(15,25,40,.22);
    --text:#1a2230;--text-dim:#4a586c;--text-mute:#7b879a;
    --sel:rgba(60,140,255,.42);--last:rgba(255,190,0,.5);--check:rgba(230,60,60,.6);
    background:
      radial-gradient(1100px 700px at 18% -10%, #dfe7f2 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #e8eef8 0%, transparent 55%),
      linear-gradient(180deg,#f4f6fa,#e7ebf2);
  }
  body.theme-light select,body.theme-light button{background:#e6eaf1;border-color:rgba(15,25,40,.14)}
  body.theme-light select:hover,body.theme-light button:hover{background:#dde3ec;border-color:var(--border-strong)}
  body.theme-light .color-picker button{background:#e6eaf1}
  body.theme-light .color-picker button.active,
  body.theme-light button.primary{background:linear-gradient(180deg,#2f7cf6,#215ec4);border-color:#2f7cf6;color:#fff}
  body.theme-light .info-cell,body.theme-light .clock,body.theme-light .moves{background:#e9edf3}
  body.theme-light .moves::-webkit-scrollbar-thumb{background:rgba(15,25,40,.2)}
  body.theme-light .mv-row:nth-child(odd){background:rgba(15,25,40,.04)}
  body.theme-light .mv-row.current{background:rgba(79,157,255,.18);outline:1px solid rgba(79,157,255,.45)}
  body.theme-light .pgn-textarea{background:#f6f8fb}
  body.theme-light .toast{background:rgba(250,251,253,.97)}
  body.theme-light .modal{background:rgba(205,215,230,.6)}
  body.theme-light .modal-box{background:#fff}
  body.theme-light .status{background:rgba(15,25,40,.04)}
  body.theme-light .status.win{background:rgba(95,207,128,.1)}
  body.theme-light .status.lose{background:rgba(255,107,107,.08)}
  body.theme-light .status.draw{background:rgba(240,192,80,.1)}
  body.theme-light .board-wrap{box-shadow:0 18px 50px rgba(30,40,60,.28),0 0 0 1px rgba(255,255,255,.6) inset}
  body.theme-light .captured-row{background:linear-gradient(180deg,rgba(15,25,40,.035),rgba(15,25,40,.012))}
  body.theme-light .captured-row .advantage{background:rgba(15,25,40,.06)}
  body.theme-light button.ghost{background:transparent}
  body.theme-light button.ghost:hover{background:rgba(15,25,40,.05)}

  /* ============================================================
     Handy / kleine Screens
     ============================================================ */
  @media(max-width:720px){
    .board{--size:min(78vh,640px,calc(100vw - 68px))}
    .captured-row{width:min(78vh,640px,calc(100vw - 68px))}
  }
  @media(max-width:560px){
    .app{padding:10px 10px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,18px))}
    .app-title{font-size:1.05rem}
    .app-title .logo{width:30px;height:30px;font-size:17px}
    .top-actions{width:100%;justify-content:stretch}
    .top-actions button{flex:1;padding:12px 16px}
    .panel{padding:13px}
    .board-wrap{padding:8px;border-radius:11px}
    .board{--size:min(78vh,calc(100vw - 48px))}
    .captured-row{width:min(78vh,calc(100vw - 48px));font-size:18px;min-height:38px;padding:5px 9px}
    select,button{padding:12px}
    .btn-row button,.btn-grid button,.color-picker button{padding:13px 8px;font-size:.9rem}
    .moves{height:120px}
    .modal{padding:12px}
    .modal-box{padding:18px 16px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-title">
      <span class="logo">♞</span>
      <span><span data-i18n="appTitle">Schach</span> <span style="color:var(--text-mute);font-weight:400" data-i18n="appVs">vs. Engine</span></span>
    </div>
    <div class="top-actions">
      <button id="newGame" class="primary" style="width:auto" data-i18n="newGame">Neue Partie</button>
    </div>
  </header>

  <main>
    <div class="board-area">
      <div class="captured-row" id="capturedTop">
        <div class="side empty" id="capturedTopSide"></div>
        <div class="advantage" id="advantageTop" style="visibility:hidden">+0</div>
      </div>
      <div class="board-wrap">
        <div id="board" class="board" role="grid" data-i18n-aria="boardAria" aria-label="Schachbrett"></div>
      </div>
      <div class="captured-row" id="capturedBottom">
        <div class="side empty" id="capturedBottomSide"></div>
        <div class="advantage" id="advantageBottom" style="visibility:hidden">+0</div>
      </div>
    </div>

    <aside class="panel">
      <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText" data-i18n="ready">Bereit. Wähle eine Farbe und starte eine Partie.</span>
      </div>

      <div class="info-grid">
        <div class="info-cell"><div class="k" data-i18n="infoDepth">Tiefe</div><div class="v" id="infoDepth">–</div></div>
        <div class="info-cell"><div class="k" data-i18n="infoNodes">Knoten</div><div class="v" id="infoNodes">–</div></div>
        <div class="info-cell"><div class="k" data-i18n="infoTime">Zeit</div><div class="v" id="infoTime">–</div></div>
        <div class="info-cell"><div class="k" data-i18n="infoScore">Bewertung</div><div class="v" id="infoScore">–</div></div>
      </div>

      <div class="clocks" id="clockBar" hidden>
        <div class="clock" id="clockW"><span class="clock-label" data-i18n="white">Weiß</span><span class="clock-time" id="clockTimeW">–</span></div>
        <div class="clock" id="clockB"><span class="clock-label" data-i18n="black">Schwarz</span><span class="clock-time" id="clockTimeB">–</span></div>
      </div>

      <div class="panel-section">
        <label for="mode" data-i18n="mode">Modus</label>
        <select id="mode">
          <option value="pve" selected data-i18n="modePve">Gegen Engine</option>
          <option value="pvp" data-i18n="modePvp">Zwei Spieler (PvP)</option>
        </select>
      </div>

      <div class="panel-section">
        <label data-i18n="side">Spielfarbe</label>
        <div class="color-picker" id="colorPicker">
          <button data-color="w" class="active" data-i18n="white">Weiß</button>
          <button data-color="b" data-i18n="black">Schwarz</button>
          <button data-color="r" data-i18n="random">Zufällig</button>
        </div>
      </div>

      <div class="panel-section">
        <label for="level" data-i18n="skill">Schwierigkeit</label>
        <select id="level">
          <option value="0" data-i18n="level0">Anfänger</option>
          <option value="1" data-i18n="level1">Leicht</option>
          <option value="2" selected data-i18n="level2">Mittel</option>
          <option value="3" data-i18n="level3">Schwer</option>
          <option value="4" data-i18n="level4">Meister</option>
        </select>
      </div>

      <div class="panel-section">
        <label for="tcSelect" data-i18n="clock">Schachuhr</label>
        <select id="tcSelect">
          <option value="0" selected data-i18n="tc0">Ohne Uhr</option>
          <option value="180000|2000" data-i18n="tc1">Blitz 3+2</option>
          <option value="300000|3000" data-i18n="tc2">Blitz 5+3</option>
          <option value="600000|0" data-i18n="tc3">Schnellschach 10+0</option>
        </select>
      </div>

      <div class="btn-grid">
        <button id="undo" data-i18n="undo">↶ Zurück</button>
        <button id="redo" data-i18n="redo">↷ Wiederholen</button>
        <button id="flip" data-i18n="flip">⇅ Drehen</button>
        <button id="resign" class="ghost" data-i18n="resign">Aufgeben</button>
      </div>

      <div class="btn-grid">
        <button id="hint" data-i18n="hint">💡 Tipp</button>
        <button id="soundBtn" class="ghost">🔊 Sound</button>
      </div>

      <div class="btn-grid">
        <button id="copyPgn" class="ghost" data-i18n="copyPgn">PGN kopieren</button>
        <button id="importPgn" class="ghost" data-i18n="loadPgn">PGN laden</button>
      </div>

      <div class="panel-section">
        <label for="langSelect" data-i18n="language">Sprache</label>
        <select id="langSelect" aria-label="Sprache / Language">
          <option value="de" selected>Deutsch</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="panel-section">
        <label data-i18n="appearance">Darstellung</label>
        <div class="theme-row">
          <select id="themeSelect" data-i18n-aria="schemeAria" aria-label="Farbschema">
            <option value="dark" selected data-i18n="themeDark">Dunkel</option>
            <option value="light" data-i18n="themeLight">Hell</option>
          </select>
          <select id="boardSelect" data-i18n-aria="paletteAria" aria-label="Brettfarben">
            <option value="walnut" selected data-i18n="boardWalnut">Walnuß</option>
            <option value="green" data-i18n="boardGreen">Grün</option>
            <option value="blue" data-i18n="boardBlue">Blau</option>
          </select>
        </div>
      </div>

      <div class="panel-section">
        <label data-i18n="moves">Züge</label>
        <div id="moves" class="moves"></div>
      </div>
    </aside>
  </main>
</div>

<!-- Promotion modal -->
<div id="promo" class="modal">
  <div class="modal-box">
    <h3 data-i18n="promoTitle">Umwandlung</h3>
    <p data-i18n="promoText">Wähle die Figur, in die der Bauer umgewandelt werden soll.</p>
    <div class="promo-row" id="promoRow"></div>
  </div>
</div>

<!-- PGN modal -->
<div id="pgnModal" class="modal">
  <div class="modal-box">
    <h3 id="pgnTitle">PGN</h3>
    <p id="pgnHint">Füge hier eine Partie im PGN-Format ein:</p>
    <textarea id="pgnText" class="pgn-textarea" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button id="pgnCancel" class="ghost" style="width:auto">Abbrechen</button>
      <button id="pgnOk" class="primary" style="width:auto">Übernehmen</button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div id="confirmModal" class="modal">
  <div class="modal-box">
    <h3 id="confirmTitle">Bestätigen</h3>
    <p id="confirmText">Sicher?</p>
    <div class="modal-actions">
      <button id="confirmNo" class="ghost" style="width:auto" data-i18n="cancel">Abbrechen</button>
      <button id="confirmYes" class="primary" style="width:auto" data-i18n="confirm">Bestätigen</button>
    </div>
  </div>
</div>

              !((f5 > 0 ? wM[f5 - 1] & behindM : 0) || (f5 < 7 ? wM[f5 + 1] & behindM : 0))) {

    /* ---------- SEE (statische Schlagzug-Bewertung) ---------- */

      } else {

        t = sq + 17; if (!(t & 0x88) && b[t] === 9) return t;
      }

      var dg = by === 0 ? 3 : 11, qu = by === 0 ? 5 : 13, ln = by === 0 ? 4 : 12;
      for (i = KN_OFF[sq]; i < KN_OFF[sq + 1]; i++) { t = KN_FLAT[i]; if (b[t] === kn) return t; }
      var b4 = sq << 2;
      for (i = 0; i < 4; i++) {
        for (j = RAYB_IDX[b4 + i]; j < RAYB_IDX[b4 + i + 1]; j++) {
          t = RAYB[j]; p = b[t];
          if (!p) continue;
          if (p === dg || p === qu) return t;
          break;
        }
      }
      for (i = 0; i < 4; i++) {
        for (j = RAYR_IDX[b4 + i]; j < RAYR_IDX[b4 + i + 1]; j++) {
          t = RAYR[j]; p = b[t];

    function seeRec(sq, by, depth) {

      var victim = board[sq];

    function seeOfMove(m) {

        var vp = board[cs];

        var vEP = VAL_T[PAWN] - seeRec(to, c ^ 1, 0);

      }

      board[from] = 0;

    /* ---------- gibt der Zug Schach? (konservativ-korrekt fürs Pruning) ----------

       Bejahungen kosten nur Suchzeit, nie Stärke. Deshalb: Rochade (Turm landet neu,
       kann direkt schachgeben) und en passant (der geschlagene Bauer kann Linien
       freigeben) werden als potentielles Schach behandelt — vorher FALSE NEGATIVES.

       Entdeckungslinie wieder (selten, harmlos). */

      if (pt === KING) return false;

    /* ---------- TT (depth-preferred + Aging) ---------- */

        else if (killer1[ply] === m) sc[i] = 590000;

        var ts = sc[i]; sc[i] = sc[bi]; sc[bi] = ts;

    }

    function checkTime() {
      if (now() > hardDeadline) aborted = true;
    }

    /* ---------- Quiescence ---------- */
    function qsearch(alpha, beta, ply) {

/* ============================================================
   Worker-Glue (Release) — protokollkompatibel zur bisherigen Engine
   Eingang:  { fen, level, requestId, histKeys? }
   Ausgang:  { requestId, move:{from,to,promotion}, depth, score, nodes, elapsed }
             | { requestId, gameOver:true } | { requestId, fatal }
   Score aus Sicht der Seite am Zug (wie bisher; die UI rechnet um).
   ============================================================ */
var ENGINE = createEngine();
var LEVELS = [
  { time: 400,  depth: 2,  topN: 5, margin: 120, rand: 0.20 }, // Anfänger
  { time: 900,  depth: 4,  topN: 3, margin: 60,  rand: 0.05 }, // Leicht
  { time: 2000, depth: 12, topN: 1, margin: 0,   rand: 0.00 }, // Mittel
  { time: 4000, depth: 24, topN: 1, margin: 0,   rand: 0.00 }, // Schwer
  { time: 8000, depth: 64, topN: 1, margin: 0,   rand: 0.00 }  // Meister
];

self.onmessage = function (e) {
  var data = e.data;
  if (!data || !data.fen || !data.requestId) return;
  var myRequest = data.requestId;
  try {
    var cfg = LEVELS[data.level] || LEVELS[2];
    // histKeys = bisherige Stellungen der Partie (Positionsschlüssel) für
    // Wiederholungserkennung; doppelte/aktuelle Stellung wird intern gefiltert.
    ENGINE.loadFen(data.fen, data.histKeys || []);
    var res = ENGINE.gameResult();
    if (res && res.over) {
      self.postMessage({ requestId: myRequest, gameOver: true });
      return;
    }

    var rootMoves = ENGINE.legalMoves();
    if (rootMoves.length === 0) {
      self.postMessage({ requestId: myRequest, gameOver: true });
      return;
    }

    // Tipp-Anfrage (Batch 6): echte Suche — kein Buch, keine Schwächung,
    // feste ~1,2s. Antwort-Feld `hint` statt `move`, damit die UI es
    // eindeutig von einem Engine-Zug unterscheiden kann.
    if (data.hint) {
      var rH = ENGINE.search(1200, 20);
      var hMove = (rH && rH.move) ? rH.move : rootMoves[0];
      self.postMessage({
        requestId: myRequest,
        hint: { from: hMove.from, to: hMove.to, promotion: hMove.promotion || null },
        score: rH ? rH.score : 0,
        depth: rH ? rH.depth : 0,
        elapsed: rH ? rH.elapsed : 0
      });
      return;
    }

    // Eröffnungsbuch (nur Mittel/Schwer/Meister): Positionsschlüssel -> Züge.
    // Buchzug wird gegen die eigene Legalitätsliste geprüft (doppelte Absicherung).
    if (data.level >= 2 && typeof BOOK !== 'undefined' && BOOK) {
      var bkMoves = BOOK[ENGINE.positionKey()];
      if (bkMoves && bkMoves.length) {
        var pick = bkMoves[Math.floor(Math.random() * bkMoves.length)];
        for (var bi = 0; bi < rootMoves.length; bi++) {
          var rb = rootMoves[bi];
          if (rb.from + rb.to + (rb.promotion || '') === pick) {
            self.postMessage({
              requestId: myRequest,
              move: { from: rb.from, to: rb.to, promotion: rb.promotion || null },
              depth: 0, score: 0, nodes: 0, elapsed: 0,
              book: true
            });
            return;
          }
        }
      }
    }

    // Bewusste Schwächung (wie bisher): gelegentlich ein Zufallszug
    if (cfg.rand > 0 && Math.random() < cfg.rand && rootMoves.length > 1) {
      var rm = rootMoves[Math.floor(Math.random() * rootMoves.length)];
      self.postMessage({
        requestId: myRequest,
        move: { from: rm.from, to: rm.to, promotion: rm.promotion || null },
        depth: 0, score: 0, nodes: 0, elapsed: 0
      });
      return;
    }

    var r = ENGINE.search(cfg.time, cfg.depth);
    if (!r || !r.move) {
      var fb = rootMoves[0];
      self.postMessage({
        requestId: myRequest,
        move: { from: fb.from, to: fb.to, promotion: fb.promotion || null },
        depth: 0, score: 0, nodes: 0, elapsed: 0,
        warning: 'fallback'
      });
      return;
    }

    // Defensive Legalitätsprüfung (eigene Zugliste)
    var ok = false;
    for (var i = 0; i < rootMoves.length; i++) {
      if (rootMoves[i].from === r.move.from && rootMoves[i].to === r.move.to &&
          (rootMoves[i].promotion || null) === (r.move.promotion || null)) { ok = true; break; }
    }
    if (!ok) {
      var fb2 = rootMoves[0];
      self.postMessage({
        requestId: myRequest,
        move: { from: fb2.from, to: fb2.to, promotion: fb2.promotion || null },
        depth: 0, score: 0, nodes: 0, elapsed: 0,
        warning: 'illegal-from-engine'
      });
      return;
    }

    // Kontrollierte Zugauswahl bei niedrigen Stufen (wie bisher)
    var moveOut = r.move;
    if (cfg.topN > 1 && r.scored && r.scored.length > 1) {
      var candidates = r.scored.slice(0, Math.min(cfg.topN, r.scored.length));
      var top = candidates[0].score;
      var pool = candidates.filter(function (x) { return x.score >= top - cfg.margin; });
      if (pool.length > 1) moveOut = pool[Math.floor(Math.random() * pool.length)].move;
    }

    self.postMessage({
      requestId: myRequest,
      move: { from: moveOut.from, to: moveOut.to, promotion: moveOut.promotion || null },
      depth: r.depth, score: r.score, nodes: r.nodes, elapsed: r.elapsed
    });
  } catch (err) {
    self.postMessage({
      requestId: myRequest,
      fatal: String(err && err.message || err)
    });
  }
};

  function confirmDialog(title, text, onYes) {
    // FIX (Dialog-Randfall): Re-Entrancy-Guard + vollständiges Aufräumen (auch bei
    // Escape/Klick auf den Hintergrund). Vorher blieben die yes/no-Listener nach
    // Escape bestehen und wurden beim nächsten Dialog DOPPELT gefeuert.
    if (confirmModalEl.classList.contains('show')) return;
    confirmTitleEl.textContent = title;
    confirmTextEl.textContent = text;
    confirmModalEl.classList.add('show');
    var yes = document.getElementById('confirmYes');
    var no = document.getElementById('confirmNo');
    var done = false;
    var cleanup = function () {
      if (done) return;
      done = true;
      confirmModalEl.classList.remove('show');
      yes.removeEventListener('click', onYesClick);
      no.removeEventListener('click', onNoClick);
      confirmModalEl.removeEventListener('click', onBackdrop);
      document.removeEventListener('keydown', onKey);
    };
    var onYesClick = function(){ cleanup(); onYes(); };
    var onNoClick = function(){ cleanup(); };
    var onBackdrop = function(e){ if (e.target === confirmModalEl) cleanup(); };
    var onKey = function(e){ if (e.key === 'Escape') cleanup(); };
    yes.addEventListener('click', onYesClick);
    no.addEventListener('click', onNoClick);
    confirmModalEl.addEventListener('click', onBackdrop);
    document.addEventListener('keydown', onKey);
  }

  function isHumanTurn() {
    // FIX (Aufgeben): resigned sperrt das Brett explizit.
    // Batch 6: flagged (Zeitüberschreitung) + PvP (beide Seiten menschlich).
    return !resigned && !flagged && !game.game_over() && game.turn() === (pvpMode ? game.turn() : humanColor) && !thinking;
  }

  /* Batch 6: Wer darf aktuell Figuren dieser Farbe bewegen?
     PvE: nur die Mensch-Farbe. PvP: immer die Seite am Zug. */
  function moveColor() {
    return pvpMode ? game.turn() : humanColor;
  }

  function setInfo(data) {
    if (!data || (!data.depth && !data.nodes)) {
      infoDepthEl.textContent = '–';
      infoNodesEl.textContent = '–';
      infoTimeEl.textContent = '–';
      infoScoreEl.textContent = '–';
      infoScoreEl.className = 'v';
      return;
    }
    infoDepthEl.textContent = data.depth || '–';
    var n = data.nodes || 0;
    infoNodesEl.textContent = n >= 1000000 ? (n/1000000).toFixed(2) + 'M'
                            : n >= 1000 ? (n/1000).toFixed(1) + 'k'
                            : String(n);
    infoTimeEl.textContent = data.elapsed ? (data.elapsed/1000).toFixed(2) + 's' : '–';

    // Score aus Sicht des Menschen umrechnen
    if (typeof data.score === 'number') {
      // Engine rechnet aus Sicht der Seite am Zug; UI will Sicht des Menschen.
      var humanScore = (game.turn() === humanColor) ? data.score : -data.score;
      if (Math.abs(humanScore) > 99000) {
        var movesToMate = Math.max(1, 100000 - Math.abs(humanScore));
        var mateIn = Math.ceil(movesToMate / 2);
        infoScoreEl.textContent = (humanScore > 0 ? '+' : '-') + 'M' + mateIn;
        infoScoreEl.className = 'v ' + (humanScore > 0 ? 'pos' : 'neg');
      } else {
        var pawns = (humanScore / 100).toFixed(2);
        var sign = humanScore > 0 ? '+' : (humanScore < 0 ? '' : '');
        infoScoreEl.textContent = sign + pawns;
        infoScoreEl.className = 'v ' + (humanScore > 0 ? 'pos' : (humanScore < 0 ? 'neg' : ''));
      }
    }
  }

  /* ============================================================
     Brett Rendering
     ============================================================ */
  function render() {
    var board = game.board();
    var rows = flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
    var cols = flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

    // Bestimme Königsfeld bei Schach
    var checkSquare = null;
    if (game.in_check() && !game.game_over()) {
      var kc = game.turn();
      for (var r=0; r<8; r++) for (var c=0; c<8; c++) {
        var p = board[r][c];
        if (p && p.type === 'k' && p.color === kc) checkSquare = FILES[c] + (8 - r);
      }
    }
    // Auch bei Schachmatt markieren
    if (game.in_checkmate()) {
      var kcm = game.turn();
      for (var r2=0; r2<8; r2++) for (var c2=0; c2<8; c2++) {
        var p2 = board[r2][c2];
        if (p2 && p2.type === 'k' && p2.color === kcm) checkSquare = FILES[c2] + (8 - r2);
      }
    }

    var frag = document.createDocumentFragment();
    for (var ri=0; ri<8; ri++) {
      var r = rows[ri];
      for (var ci=0; ci<8; ci++) {
        var c = cols[ci];
        var sq = FILES[c] + (8 - r);
        var piece = board[r][c];
        var el = document.createElement('div');
        el.className = 'square ' + (((r + c) % 2 === 0) ? 'light' : 'dark');
        el.dataset.square = sq;
        el.setAttribute('role','gridcell');

        if (lastMove && (sq === lastMove.from || sq === lastMove.to)) el.classList.add('last');
        if (sq === selected) el.classList.add('sel');
        if (sq === checkSquare) el.classList.add('check');
        if (hintFrom && (sq === hintFrom || sq === hintTo)) el.classList.add('hint-move');

        if (ci === 0) {
          var rl = document.createElement('span');
          rl.className = 'coord rank';
          rl.textContent = String(8 - r);
          el.appendChild(rl);
        }
        if (ri === 7) {
          var fl = document.createElement('span');
          fl.className = 'coord file';
          fl.textContent = FILES[c];
          el.appendChild(fl);
        }
        if (piece) {
          var sp = document.createElement('span');
          sp.className = 'piece ' + piece.color;
          sp.textContent = GLYPH[piece.type];
          sp.dataset.pieceType = piece.type;
          sp.dataset.pieceColor = piece.color;
          el.appendChild(sp);
        }
        if (legalTargets.indexOf(sq) !== -1) {
          var h = document.createElement('span');
          h.className = piece ? 'hint capture' : 'hint';
          el.appendChild(h);
        }
        frag.appendChild(el);
      }
    }
    boardEl.innerHTML = '';
    boardEl.appendChild(frag);

    // Buttons aktualisieren
    // FIX (Undo-Race): "Zurück" ist jetzt auch während des Engine-Denkens aktiv —
    // cancelBot() bricht die Suche sauber ab (Worker terminiert, Timer geräumt).
    document.getElementById('undo').disabled = game.history().length === 0;
    document.getElementById('redo').disabled = redoStack.length === 0 || thinking || resigned;
  }

  /* ============================================================
     Status & Move List
     ============================================================ */
  function updateStatus() {
    var text, cls = '';
    if (game.game_over() || resigned || flagged) clockStop();   // Batch 6: Uhr anhalten
    if (flagged) {
      // Batch 6: Zeitüberschreitung
      if (pvpMode) {
        text = TF('flagPvp', T(flagged === 'w' ? 'black' : 'white'));
        cls = 'draw';
      } else if (flagged === humanColor) {
        text = T('flagEngine');
        cls = 'lose';
      } else {
        text = T('flagYou');
        cls = 'win';
      }
    } else if (resigned) {
      // FIX (Aufgeben): Status bleibt stabil, auch wenn später updateAll() läuft.
      text = pvpMode ? T('resignPvp') : T('resignYou');
      cls = 'lose';
    } else if (game.game_over()) {
      if (game.in_checkmate()) {
        if (pvpMode) {
          text = TF('matePvp', T(game.turn() === 'w' ? 'black' : 'white'));
          cls = 'win';
        } else if (game.turn() === humanColor) { text = T('mateEngine'); cls = 'lose'; }
        else { text = T('mateYou'); cls = 'win'; }
      } else if (game.in_stalemate()) {
        text = T('stalemate'); cls = 'draw';
      } else if (game.in_threefold_repetition()) {
        text = T('repDraw'); cls = 'draw';
      } else if (game.insufficient_material()) {
        text = T('materialDraw'); cls = 'draw';
      } else {
        // 50-Züge-Regel oder sonstiges Remis — chess.js game_over() deckt das ab
        var fenParts = game.fen().split(' ');
        var halfmove = parseInt(fenParts[4], 10) || 0;
        if (halfmove >= 100) { text = T('fiftyDraw'); cls = 'draw'; }
        else { text = T('over'); cls = 'draw'; }
      }
    } else if (thinking) {
      text = T('thinking');
    } else if (!pvpMode && game.turn() === humanColor) {
      text = game.in_check() ? T('yourTurnCheck') : T('yourTurn');
    } else {
      text = pvpMode
        ? (game.in_check() ? TF('colorTurnCheck', T(game.turn() === 'w' ? 'white' : 'black'))
                           : TF('colorTurn', T(game.turn() === 'w' ? 'white' : 'black')))
        : T('engineTurn');
    }
    statusTextEl.textContent = text;
    statusEl.className = 'status ' + cls + (thinking ? ' thinking' : '');
  }

  function updateMoveList() {
    var hist = game.history();
    var html = '';
    for (var i=0; i<hist.length; i += 2) {
      var num = (i/2 + 1) + '.';
      var w = hist[i] || '';
      var b = hist[i+1] || '';
      var isCurrent = (i + 1 === hist.length) || (i + 2 === hist.length);
      html += '<div class="mv-row' + (isCurrent ? ' current' : '') + '">'
            + '<span class="mv-num">' + num + '</span>'
            + '<span class="mv' + (w ? '' : ' empty') + '">' + (w || '') + '</span>'
            + '<span class="mv' + (b ? '' : ' empty') + '">' + (b || '') + '</span>'
            + '</div>';
    }
    movesEl.innerHTML = html;
    movesEl.scrollTop = movesEl.scrollHeight;
  }

  /* ============================================================
     Geschlagene Figuren & Materialbilanz
     ============================================================ */
  function computeCaptured() {
    // FIX (Materialanzeige bei Umwandlungen): Geschlagene Figuren kommen JETZT aus
    // der Zug-Historie (echte Captures) statt aus einem Abgleich mit dem
    // Startmaterial. Vorher sah eine Umwandlung wie "Bauer geschlagen" aus
    // (z. B. "8 Bauern geschlagen", obwohl nur verwandelt wurde). Die
    // Materialbilanz (Vorteilszahl) wird weiterhin aus der IST-Stellung berechnet
    // — die ist auch bei Umwandlungen korrekt, weil die neue Dame auf dem Brett steht.
    var cap = { w:{}, b:{} }; // cap.w = von Weiß geschlagene (schwarze) Figuren
    var hist = game.history({ verbose:true });
    for (var i=0; i<hist.length; i++) {
      var m = hist[i];
      if (m.captured) cap[m.color][m.captured] = (cap[m.color][m.captured] || 0) + 1;
    }
    // Material aus IST-Zustand (korrekt bei Umwandlungen)
    var mat = { w:0, b:0 };
    var board = game.board();
    for (var r=0; r<8; r++) for (var c=0; c<8; c++) {
      var p = board[r][c];
      if (p) mat[p.color] += PIECE_VAL[p.type];
    }
    return { capturedByWhite: cap.w, capturedByBlack: cap.b, matW: mat.w, matB: mat.b };
  }

  function renderCaptured() {
    var data = computeCaptured();
    // capturedByWhite = schwarze Figuren, die Weiß geschlagen hat
    // capturedByBlack = weiße Figuren, die Schwarz geschlagen hat
    var diff = data.matW - data.matB; // >0: Weiß führt

    // Oben: zeigt die Figuren, die der OBEN stehende Spieler verloren hat.
    // Wir zeigen oben die GEGNER-FIGUREN des menschlichen Spielers, wenn
    // der Mensch unten sitzt. Generell: oben = Gegenseite des menschlichen
    // Spielers (Standardansicht). Wenn geflippt, andersherum.
    var topIsHumanColor = flipped;
    var topColor = topIsHumanColor ? humanColor : (humanColor === 'w' ? 'b' : 'w');
    // Figuren, die oben angezeigt werden: die des Spielers, der OBEN sitzt,
    // die er VERLOREN hat.
    var topCaptured = topColor === 'w' ? data.capturedByBlack : data.capturedByWhite;
    var bottomCaptured = topColor === 'w' ? data.capturedByWhite : data.capturedByBlack;

    renderCapturedSide(capturedTopSideEl, topCaptured, topColor === 'w' ? 'w' : 'b');
    renderCapturedSide(capturedBottomSideEl, bottomCaptured, topColor === 'w' ? 'b' : 'w');

    // Materialvorteil aus Sicht des jeweiligen Spielers anzeigen
    var topAdvantage = topColor === 'w' ? diff : -diff;
    var bottomAdvantage = -topAdvantage;

    updateAdvantage(advantageTopEl, topAdvantage);
    updateAdvantage(advantageBottomEl, bottomAdvantage);
  }

  function renderCapturedSide(container, captured, color) {
    container.innerHTML = '';
    var order = ['q','r','b','n','p'];
    var hasAny = false;
    for (var i=0; i<order.length; i++) {
      var ty = order[i];
      var n = captured[ty] || 0;
      if (n <= 0) continue;
      hasAny = true;
      for (var j=0; j<n; j++) {
        var span = document.createElement('span');
        span.className = 'piece-glyph ' + color;
        span.textContent = GLYPH[ty];
        container.appendChild(span);
      }
    }
    if (hasAny) container.classList.remove('empty');
    else container.classList.add('empty');
  }

  function updateAdvantage(el, value) {
    if (value === 0) {
      el.style.visibility = 'hidden';
      el.textContent = '0';
      el.className = 'advantage';
    } else {
      el.style.visibility = 'visible';
      var sign = value > 0 ? '+' : '';
      el.textContent = sign + value;
      el.className = 'advantage ' + (value > 0 ? 'pos' : 'neg');
    }
  }

  /* ============================================================
     Komplettes UI-Update
     ============================================================ */
  function updateAll() {
    render();
    updateStatus();
    updateMoveList();
    renderCaptured();
  }

  /* ============================================================
     Spielsteuerung
     ============================================================ */
  function newGame(force) {
    var startNew = function() {
      gameId++;
      cancelBot();
      closePromo();
      thinking = false;
      resigned = false; // FIX (Aufgeben): Neue Partie räumt den resignierten Zustand ab
      game = new Chess();
      selected = null;
      legalTargets = [];
      lastMove = null;
      redoStack = [];
      setInfo(null);
      // Batch 6: Tipp-Markierung + Uhr zurücksetzen
      clearHint();
      clockReset();
      // FIX (Zufallsfarbe): Auslosen basiert auf colorChoice; humanColor ist
      // danach IMMER 'w' oder 'b' (nie 'r').
      resolveColor();
      flipped = (humanColor === 'b');
      setActiveColorButton(colorChoice);
      updateAll();
      // Batch 6: Uhr läuft ab Partiestart (Weiß am Zug)
      clockStart();
      // Wenn die Engine anzieht (Mensch spielt Schwarz), Engine starten
      if (!pvpMode && game.turn() !== humanColor && !game.game_over()) {
        botTurn();
      }
    };
    if (!force && game.history().length > 0 && !game.game_over() && !resigned) {
      confirmDialog(T('newGameTitle'), T('newGameConfirm'), startNew);
    } else {
      startNew();
    }
  }

  function resolveColor() {
    // FIX (Zufallsfarbe blockiert): Das Auslösen passiert NUR hier — humanColor
    // kann danach nie 'r' sein, also bleibt game.turn() === humanColor immer
    // entscheidbar und das Spiel kann nicht blockieren.
    humanColor = (colorChoice === 'r') ? (Math.random() < 0.5 ? 'w' : 'b') : colorChoice;
  }

  function chooseColor(c) {
    // FIX (Farbwahl inkonsistent + Zufallsfarbe): Jede Farbwahl wird SOFORT
    // aufgelöst ('r' → Münzwurf), nie als 'r' gespeichert. Bei laufender Partie
    // startet die gewählte Farbe eine NEUE Partie (mit Bestätigung) — vorher
    // zeigte der Button "Zufällig" an, aber Brett/Farbe änderten sich erst bei
    // der nächsten Partie (oder schlimmer: 'r' blockierte das Spiel komplett).
    var inProgress = game.history().length > 0 && !game.game_over() && !resigned;
    var label = (c === 'r') ? T('randColor') : TF('asColor', T(c === 'w' ? 'white' : 'black'));
    var apply = function () {
      colorChoice = c;
      setActiveColorButton(c);
      resolveColor();
      var restart = game.history().length > 0 || game.game_over() || resigned;
      if (restart) {
        newGame(true); // colorChoice ist bereits gesetzt; Bestätigung entfällt
      } else {
        flipped = (humanColor === 'b');
        updateAll();
        if (!game.game_over() && game.turn() !== humanColor) botTurn();
      }
      showToast(TF('youPlay' + (c === 'r' ? 'Rand' : ''), T(humanColor === 'w' ? 'white' : 'black')));
    };
    if (inProgress) {
      confirmDialog(T('colorSwitchTitle'), TF('colorSwitchConfirm', label), apply);
    } else {
      apply();
    }
  }

  function setActiveColorButton(color) {
    var btns = colorPickerEl.querySelectorAll('button');
    for (var i=0; i<btns.length; i++) {
      var bc = btns[i].dataset.color;
      btns[i].classList.toggle('active', bc === color || (color === 'r' && bc === 'r'));
    }
  }

  function clearHardTimeout() {
    if (hardTimeoutHandle !== null) {
      clearTimeout(hardTimeoutHandle);
      hardTimeoutHandle = null;
    }
  }

  function cancelBot() {
    // Beendet eine laufende Engine-Berechnung HART (Undo/Neue Partie/Aufgeben/
    // PGN-Import/Hard-Timeout).
    // EHRICHE DOKU (statt der alten irreführenden Formulierung):
    // worker.terminate() zerstört auch die Transpositionstabelle des Workers.
    // Das ist hier GEWOLLT: nach Undo/Neue Partie/Import soll keine veraltete TT
    // in eine neue Suche einfließen. Bei NORMALEN Zügen wird cancelBot() deshalb
    // NICHT aufgerufen — dort bleiben Worker und TT erhalten (siehe onmessage),
    // nur die Event-Handler werden abgekoppelt.
    clearHardTimeout();
    thinking = false;
    if (worker) {
      try { worker.terminate(); } catch(e) {}
      worker = null;
    }
  }

  function getWorker() {
    if (!worker) {
      try { worker = new Worker(workerUrl); } catch (e) { worker = null; }
    }
    return worker;
  }

  function playHumanMove(move) {
    if (!isHumanTurn()) return;
    var made = game.move(move);
    if (!made) return;
    lastMove = { from: made.from, to: made.to };
    selected = null;
    legalTargets = [];
    redoStack = []; // neuer Zug → Redo-Historie verwerfen
    updateAll();
    // Batch 6: Uhr (Zöger-Zeitverbuchung) + Sound
    clockOnMove(made.color);
    moveFeedback(made);
    if (game.game_over()) return;
    botTurn();
  }

  function botTurn() {
    // Batch 6: Im PvP-Modus nie Engine anwerfen
    if (pvpMode) return;
    // Batch 6: laufende Tipp-Anfrage optisch zurücksetzen (späte Antworten
    // werden über requestId verworfen)
    hintPendingClear();
    var myGameId = gameId;
    var myRequestId = gameId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    // FIX (Undo/Redo-Race): erwartete Stellung merken — eine Engine-Antwort wird nur
    // angewendet, wenn sich das Brett seither NICHT geändert hat (zusätzliche
    // Absicherung neben gameId/requestId).
    var expectedFen = game.fen();
    thinking = true;
    engineStartTime = performance.now();
    updateStatus();
    setInfo(null);

    if (resigned || game.game_over()) {
      thinking = false;
      updateStatus();
      return;
    }

    if (!workerUrl) {
      thinking = false;
      updateStatus();
      showToast(T('engineUnavailable'));
      return;
    }

    var w = getWorker();
    if (!w) {
      thinking = false;
      updateStatus();
      showToast(T('workerFail'));
      return;
    }

    w.onmessage = function(e) {
      if (myGameId !== gameId) {
        // Späte Nachricht aus alter Partie — verwerfen!
        return;
      }
      var data = e.data || {};
      // Auch requestId prüfen
      if (data.requestId && data.requestId !== myRequestId) return;
      // FIX (Undo/Redo-Race): Antwort nur im erwarteten Kontext anwenden.
      if (!thinking || game.fen() !== expectedFen) return;

      // FIX (Hard-Timeout-Leak): Antwort da → Timer sofort räumen.
      clearHardTimeout();
      // FIX (TT bleibt erhalten): Worker wird bei NORMALEN Zügen NICHT terminiert.
      // Vorher lief cancelBot() hier bei jedem Zug → worker.terminate() killte die
      // TT jedes Mal (und der alte cancelBot-Kommentar beschrieb das Gegenteil).
      // Nur die Handler werden abgekoppelt; cancelBot() bleibt echten Abbrüchen
      // (Undo/Neu/Aufgeben/Import/Timeout) vorbehalten.
      w.onmessage = null;
      w.onerror = null;
      thinking = false;

      if (data.fatal) {
        setInfo(null);
        updateStatus();
        showToast(TF('engineError', data.fatal));
        // Versuche Fallback
        if (!game.game_over() && !resigned) playFallbackMove(T('reasonEngine'));
        return;
      }
      if (data.gameOver || !data.move) {
        updateStatus();
        if (!data.move) showToast(T('noEngineMove'));
        return;
      }
      // Legalität prüfen, bevor der Zug ausgeführt wird
      var verify = new Chess(game.fen());
      var verifyMove = verify.move({
        from: data.move.from, to: data.move.to,
        promotion: data.move.promotion || 'q'
      });
      if (!verifyMove) {
        updateStatus();
        showToast(T('illegalEngineMove'));
        if (!game.game_over() && !resigned) playFallbackMove(T('reasonIllegal'));
        return;
      }
      // Zug ausführen
      var made = game.move({
        from: data.move.from, to: data.move.to,
        promotion: data.move.promotion || 'q'
      });
      if (made) {
        lastMove = { from: made.from, to: made.to };
        clockOnMove(made.color);   // Batch 6: Uhr-Verbuchung für den Engine-Zug
        moveFeedback(made);
      }
      setInfo(data);
      updateAll();
    };

    w.onerror = function(err) {
      if (myGameId !== gameId) return;
      cancelBot();
      updateStatus();
      if (!game.game_over() && !resigned) {
        playFallbackMove(T('reasonWorker'));
      } else {
        showToast(T('workerError'));
      }
      if (err && err.preventDefault) err.preventDefault();
    };

    // Stellungshistorie für Wiederholungserkennung (per Replay, zustandslos)
    var posKeys = [];
    try {
      var tmpGame = new Chess();
      function pk(f) { var p = f.split(' '); return p[0] + ' ' + p[1] + ' ' + p[2] + ' ' + p[3]; }
      posKeys.push(pk(tmpGame.fen()));
      var histSans = game.history();
      for (var hi = 0; hi < histSans.length; hi++) {
        tmpGame.move(histSans[hi]);
        posKeys.push(pk(tmpGame.fen()));
      }
    } catch (eHist) { posKeys = []; }

    // FIX (Hard-Timeout-Race): Der 14s-Timer wird ERST NACH erfolgreichem
    // postMessage scharf geschaltet. Wirft postMessage (z. B. toter Worker),
    // gibt es keinen Timer, der später einen "Phantom-Ersatzzug" ohne laufende
    // Anfrage auslösen kann. Der Fallback selbst validiert erneut (gameId/State).
    try {
      w.postMessage({
        fen: expectedFen,
        level: levelIndex,
        requestId: myRequestId,
        histKeys: posKeys
      });
    } catch (err) {
      cancelBot();
      updateStatus();
      if (!game.game_over() && !resigned) playFallbackMove(T('reasonPost'));
      return;
    }
    clearHardTimeout();
    hardTimeoutHandle = setTimeout(function() {
      hardTimeoutHandle = null;
      if (myGameId !== gameId) return;   // Anfrage gehört nicht mehr zur Partie
      if (!thinking) return;             // Antwort wurde längst verarbeitet
      cancelBot();                        // Worker hängt → terminieren (TT-Verlust ok)
      updateStatus();
      if (!game.game_over() && !resigned) playFallbackMove(T('reasonTimeout'));
    }, 14000);
  }

  function playFallbackMove(reason) {
    // FIX (Hard-Timeout-Race): Doppelabsicherung — niemals einen Ersatzzug spielen,
    // wenn die Partie längst beendet/verlassen ist.
    if (resigned || game.game_over()) { updateAll(); return; }
    var ms = game.moves({ verbose:true });
    if (ms.length === 0) {
      updateAll();
      return;
    }
    // Wähle zufälligen legalen Zug (möglichst keinen, der sofort Material verliert)
    // Simpel: zuerst nach Schlagzügen suchen, sonst zufällig
    var captures = ms.filter(function(m){ return m.captured; });
    var pool = captures.length > 0 ? captures : ms;
    var m = pool[Math.floor(Math.random() * pool.length)];
    var made = game.move({ from:m.from, to:m.to, promotion:m.promotion || 'q' });
    if (made) {
      lastMove = { from: made.from, to: made.to };
      clockOnMove(made.color);   // Batch 6: auch Ersatzzüge verbrauchen Zeit
      moveFeedback(made);
    }
    showToast(TF('fallbackMove', reason));
    updateAll();
  }

  function undoMove() {
    if (game.history().length === 0) return;
    // FIX (Undo/Redo-Race): Undo ist jetzt auch während des Engine-Denkens erlaubt.
    // gameId++ invalidiert verspätete Antworten zusätzlich, cancelBot() terminiert
    // den Worker hart und räumt den Hard-Timeout mit ab.
    gameId++;
    cancelBot();
    closePromo();
    var revived = resigned;
    // "Zug zurück" nach Aufgabe = Partie EXPLIZIT fortsetzen (bewusste Nutzeraktion,
    // kein Fortlaufen im Hintergrund wie beim alten Bug).
    resigned = false;

    // Wir wollen nach Undo wieder am Zug sein.
    // Strategie: Undo so oft, bis der MENSCH wieder am Zug ist (max 2 Züge).
    var undone = 0;
    while (game.history().length > 0 && undone < 2) {
      var last = game.history({ verbose:true }).slice(-1)[0];
      game.undo();
      redoStack.push(last);
      undone++;
      // Batch 6: PvP nimmt immer nur EINEN Halbzug zurück
      if (pvpMode) break;
      if (game.turn() === humanColor && !game.game_over()) break;
    }

    selected = null;
    legalTargets = [];
    lastMove = null;
    var h = game.history({ verbose:true });
    if (h.length) { var m = h[h.length-1]; lastMove = { from:m.from, to:m.to }; }
    setInfo(null);
    clearHint();          // Batch 6: laufenden Tipp verwerfen
    clockUndo();          // Batch 6: Uhrzeiten der zurückgenommenen Züge wiederherstellen
    updateAll();
    if (tcBaseMs > 0 && !game.game_over() && !resigned && !flagged) clockStart();
    if (revived) showToast(T('resumed'));
  }

  function redoMove() {
    if (thinking || redoStack.length === 0 || resigned) return;
    gameId++;
    closePromo();
    var m = redoStack.pop();
    var made = game.move({ from:m.from, to:m.to, promotion:m.promotion || 'q' });
    if (made) {
      lastMove = { from: made.from, to: made.to };
      clockOnMove(made.color);   // Batch 6: Redo verbraucht wieder Zeit (neuer Snapshot)
    }
    selected = null;
    legalTargets = [];
    clearHint();
    setInfo(null);
    updateAll();
    if (tcBaseMs > 0 && !game.game_over() && !resigned && !flagged) clockStart();
    // Falls nach Redo die Engine am Zug ist, Engine starten
    if (!pvpMode && !game.game_over() && game.turn() !== humanColor) {
      botTurn();
    }
  }

  /* ============================================================
     PGN-Import / -Export
     ============================================================ */
  function buildPgn() {
    var hist = game.history();
    var lines = [];
    var result = '*';
    // FIX (Aufgeben): Aufgabe geht als reguläres Ergebnis in den PGN-Export ein.
    // Batch 6: Zeitüberschreitung ebenso.
    if (flagged) result = (flagged === 'w') ? '0-1' : '1-0';
    else if (resigned) result = (humanColor === 'w') ? '0-1' : '1-0';
    else if (game.in_checkmate()) result = (game.turn() === 'w') ? '0-1' : '1-0';
    else if (game.game_over()) result = '1/2-1/2';

    var whiteName, blackName;
    if (pvpMode) { whiteName = T('player1'); blackName = T('player2'); }
    else {
      whiteName = (humanColor === 'w') ? T('playerName') : T('engineName');
      blackName = (humanColor === 'b' ? T('playerName') : T('engineName'));
    }
    var header = [
      '[Event "' + T('pgnEvent') + '"]',
      '[Site "Local"]',
      '[Date "' + new Date().toISOString().slice(0,10).replace(/-/g,'.') + '"]',
      '[White "' + whiteName + '"]',
      '[Black "' + blackName + '"]',
      '[Result "' + result + '"]'
    ];
    var moves = [];
    for (var i=0; i<hist.length; i += 2) {
      var num = (i/2 + 1) + '.';
      var w = hist[i] || '';
      var b = hist[i+1] || '';
      if (b) moves.push(num + ' ' + w + ' ' + b);
      else moves.push(num + ' ' + w);
    }
    moves.push(result);
    return header.join('\n') + '\n\n' + moves.join(' ');
  }

  function openPgnExport() {
    pgnTitleEl.textContent = T('pgnExportTitle');
    pgnHintEl.textContent = T('pgnExportHint');
    pgnTextEl.value = buildPgn();
    pgnTextEl.readOnly = true;
    pgnModalEl.classList.add('show');
    pgnTextEl.focus();
    pgnTextEl.select();
  }

  function openPgnImport() {
    if (thinking) { showToast(T('waitEngine')); return; }
    pgnTitleEl.textContent = T('pgnImportTitle');
    pgnHintEl.textContent = T('pgnImportHint');
    pgnTextEl.value = '';
    pgnTextEl.readOnly = false;
    pgnModalEl.classList.add('show');
    setTimeout(function(){ pgnTextEl.focus(); }, 50);
  }

  // FIX (PGN ohne Header): dreistufiger Import —
  //   1) load_pgn direkt (sloppy, toleranter SAN-Parser)
  //   2) load_pgn mit ergänzten Minimal-Headern ("Quick-Share"-PGNs)
  //   3) manuelles SAN-Replay (Zugnummern/Kommentare/NAGs/Ergebnis werden entfernt)
  function tryLoadPgn(g, text) {
    try { if (g.load_pgn(text, { sloppy: true })) return true; } catch (e1) {}
    try { if (g.load_pgn(text)) return true; } catch (e2) {}
    return false;
  }

  function importPgnText(text) {
    var g = new Chess();
    if (tryLoadPgn(g, text)) return g;
    var withHeaders = '[Event "?"]\n[Site "?"]\n[Date "????.??.??"]\n[Round "?"]\n[White "?"]\n[Black "?"]\n[Result "*"]\n\n' + text;
    g = new Chess();
    if (tryLoadPgn(g, withHeaders)) return g;
    // Fallback: manuelles SAN-Replay
    var clean = text
      .replace(/\{[^}]*\}/g, ' ')               // {Kommentare}
      .replace(/;[^\n]*/g, ' ')                  // ;Restzeilen-Kommentare
      .replace(/\([^()]*\)/g, ' ')               // (Varianten, eine Ebene)
      .replace(/\$\d+/g, ' ')                    // NAGs
      .replace(/\b(1-0|0-1|1\/2-1\/2|\*)\b/g, ' ') // Ergebnis
      .replace(/\d+\s*\.(?:\.\.)?/g, ' ')       // Zugnummern ("1." / "1...")
      .trim();
    if (!clean) return null;
    var toks = clean.split(/[\s\n]+/);
    g = new Chess();
    for (var i=0; i<toks.length; i++) {
      var t = toks[i].replace(/[!?]+$/, '');     // Annotationen (!?) entfernen
      if (!t) continue;
      var mv = null;
      try { mv = g.move(t, { sloppy: true }); } catch (e3) { mv = null; }
      if (!mv) return null; // illegaler/unklarer Zug → Import scheitert bewusst
    }
    return g;
  }

  function applyPgnImport() {
    var text = pgnTextEl.value.trim();
    if (!text) { showToast(T('emptyInput')); return; }
    try {
      var g = importPgnText(text);
      if (!g) {
        showToast(T('pgnUnreadable'));
        return;
      }
      gameId++;
      cancelBot();
      closePromo();
      thinking = false;
      resigned = false; // importierte Partie ersetzt auch einen resignierten Zustand
      game = g;
      selected = null;
      legalTargets = [];
      redoStack = [];
      clearHint();
      clockReset();       // Batch 6: importierte Partie startet mit frischer Uhr
      var h = game.history({ verbose:true });
      lastMove = h.length ? { from:h[h.length-1].from, to:h[h.length-1].to } : null;
      // Falls die Seite am Zug ist, die nicht der Mensch ist → Engine starten
      pgnModalEl.classList.remove('show');
      setInfo(null);
      updateAll();
      clockStart();       // Batch 6: Uhr läuft (außer Partie bereits vorbei)
      if (!pvpMode && !game.game_over() && game.turn() !== humanColor) {
        botTurn();
      }
      showToast(T('pgnLoaded'));
    } catch (err) {
      showToast(TF('pgnError', (err.message || err)));
    }
  }

  /* ============================================================
     Interaktion: Klick + Drag&Drop
     ============================================================ */
  function squareFromPoint(clientX, clientY) {
    var rect = boardEl.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    if (x < 0 || y < 0 || x >= rect.width || y >= rect.height) return null;
    var fileIdx = Math.floor(x / (rect.width / 8));
    var rankIdx = Math.floor(y / (rect.height / 8));
    if (flipped) { fileIdx = 7 - fileIdx; rankIdx = 7 - rankIdx; }
    return FILES[fileIdx] + (8 - rankIdx);
  }

  function selectSquare(sq) {
    var piece = game.get(sq);
    if (piece && piece.color === moveColor() && isHumanTurn()) {
      selected = sq;
      legalTargets = game.moves({ square: sq, verbose: true }).map(function(m){ return m.to; });
    } else {
      selected = null;
      legalTargets = [];
    }
    render();
  }

  function tryMove(fromSq, toSq) {
    if (!isHumanTurn()) return false;
    var candidates = game.moves({ square: fromSq, verbose: true })
                          .filter(function(m){ return m.to === toSq; });
    if (candidates.length === 0) return false;
    if (candidates.length > 1) {
      // Umwandlung → Dialog
      askPromotion(fromSq, toSq);
      return true;
    }
    playHumanMove(candidates[0]);
    return true;
  }

  function onSquareClick(sq) {
    if (pendingPromo) return; // Dialog offen
    if (!isHumanTurn()) return;
    if (selected) {
      if (sq === selected) {
        selected = null; legalTargets = []; render(); return;
      }
      // Versuch Zug
      if (tryMove(selected, sq)) return;
      // Kein legaler Zug → evtl. andere eigene Figur wählen
      selectSquare(sq);
      return;
    }
    selectSquare(sq);
  }

  function closePromo() {
    // FIX (Promo-Modal): EIN einziger Aufräum-Punkt für ALLE Wege (Escape, Hintergrund-
    // Klick, Undo, Neue Partie, Aufgeben, Import). Vorher setzten verschiedene Stellen
    // pendingPromo/Klasse einzeln — bei schnellen Eingaben konnte der Zustand
    // auseinanderlaufen (Modal zu, pendingPromo noch gesetzt oder umgekehrt).
    pendingPromo = null;
    promoEl.classList.remove('show');
  }

  function askPromotion(from, to) {
    if (!isHumanTurn()) return;
    pendingPromo = { from: from, to: to };
    promoRowEl.innerHTML = '';
    ['q','r','b','n'].forEach(function(p) {
      var b = document.createElement('button');
      b.className = 'promo-btn';
      b.textContent = GLYPH[p];
      b.addEventListener('click', function() {
        var pp = pendingPromo;
        closePromo();
        if (pp) playHumanMove({ from: pp.from, to: pp.to, promotion: p });
      });
      promoRowEl.appendChild(b);
    });
    promoEl.classList.add('show');
  }

  /* ============================================================
     Interaktion: EIN einheitlicher Eingabepfad (Tap vs. Drag)
     ------------------------------------------------------------
     FIX (Touch/Click-Doppeltrigger): Vorher selektierte der
     mousedown/touchstart-Handler sofort UND der danach feuernde
     'click'-Handler togglelte dieselbe Figur wieder ab — auf Mobilgeräten
     (und je nach Browser auch am Desktop) wurde ein Tippen damit zu
     "auswählen → sofort wieder abwählen". Jetzt gibt es GENAU EINEN
     Entscheidungspunkt: pointerup unterscheidet Tap (kein Bewegung > 6px)
     von Drag. Ein separater click-Listener existiert bewusst NICHT mehr.
     ============================================================ */
  var DRAG_THRESHOLD = 6; // px — darunter gilt ein Pointer als Tipp
  var input = null;       // { from, ownPiece, wasSelected, startX, startY, moved, id, visual }

  function posOf(e) {
    if (typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    var t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]);
    return t ? { x: t.clientX, y: t.clientY } : { x: 0, y: 0 };
  }

  function samePointer(e, st) {
    return st.id === null || e.pointerId === undefined || e.pointerId === st.id;
  }

  function clearDragVisual(st) {
    if (st && st.visual) { st.visual.classList.remove('dragging'); st.visual = null; }
  }

  function inputDown(pos, e) {
    if (input) return;                    // zweiter Finger / zweite Taste ignorieren
    if (pendingPromo) return;             // Umwandlungsdialog offen
    if (!isHumanTurn()) return;
    var sq = squareFromPoint(pos.x, pos.y);
    if (!sq) return;
    var piece = game.get(sq);
    var own = !!(piece && piece.color === moveColor());
    if (!own && !selected) return;        // nichts zu tun (leeres Feld ohne Auswahl)
    input = {
      from: sq,
      ownPiece: own,
      wasSelected: (selected === sq),
      startX: pos.x, startY: pos.y,
      moved: false,
      id: (e && e.pointerId !== undefined) ? e.pointerId : null,
      visual: null
    };
    if (e && e.cancelable) e.preventDefault(); // kein Scroll/Textauswahl/Kompatibilitäts-Click
  }

  function inputMove(pos, e) {
    if (!input || !samePointer(e, input)) return;
    var dx = pos.x - input.startX, dy = pos.y - input.startY;
    if (!input.moved && (dx * dx + dy * dy) > DRAG_THRESHOLD * DRAG_THRESHOLD) {
      input.moved = true;
      if (input.ownPiece) {
        var el = boardEl.querySelector('.square[data-square="' + input.from + '"] .piece');
        if (el) { el.classList.add('dragging'); input.visual = el; }
      }
    }
    if (input.moved && e.cancelable) e.preventDefault();
  }

  function inputUp(pos, e) {
    if (!input || !samePointer(e, input)) return;
    ensureAudio();   // Batch 6: Audio-Kontext beim ersten Brett-Kontakt freischalten
    var st = input;
    input = null;
    clearDragVisual(st);
    var toSq = squareFromPoint(pos.x, pos.y);

    if (!st.moved) {                       // --- TIPP ---
      onSquareClick(st.from);
      return;
    }
    if (!st.ownPiece) return;              // Drag ohne eigene Figur → kein Zug
    if (!toSq) return;                     // außerhalb abgelegt → Auswahl bleibt
    if (toSq === st.from) {                // zurückgelegt → Auswahlzustand wie vorher
      if (!st.wasSelected) selectSquare(st.from);
      return;
    }
    // --- DRAG-ZUG ---
    if (!tryMove(st.from, toSq)) {
      var pc = game.get(toSq);
      if (pc && pc.color === moveColor()) selectSquare(toSq); // eigene Figur → neu wählen
      else { selected = null; legalTargets = []; render(); } // ungültig → abwählen
    }
  }

  function inputCancel(e) {
    if (!input || !samePointer(e, input)) return;
    var st = input;
    input = null;
    clearDragVisual(st);
  }

  if (window.PointerEvent) {
    // Moderner Pfad: Pointer Events decken Maus UND Touch ab (kein Doppel-Dispatch).
    boardEl.addEventListener('pointerdown', function (e) { inputDown(posOf(e), e); });
    window.addEventListener('pointermove', function (e) { inputMove(posOf(e), e); }, { passive: false });
    window.addEventListener('pointerup', function (e) { inputUp(posOf(e), e); });
    window.addEventListener('pointercancel', inputCancel);
  } else {
    // Legacy-Fallback (sehr alte Browser ohne Pointer Events) — ebenfalls OHNE
    // separaten click-Handler, damit kein Doppel-Dispatch entstehen kann.
    boardEl.addEventListener('touchstart', function (e) { inputDown(posOf(e), e); }, { passive: false });
    window.addEventListener('touchmove', function (e) { inputMove(posOf(e), e); }, { passive: false });
    window.addEventListener('touchend', function (e) { inputUp(posOf(e), e); });
    window.addEventListener('touchcancel', inputCancel);
    boardEl.addEventListener('mousedown', function (e) { inputDown(posOf(e), e); });
    window.addEventListener('mousemove', function (e) { inputMove(posOf(e), e); });
    window.addEventListener('mouseup', function (e) { inputUp(posOf(e), e); });
  }

  // Verhindere Kontextmenü & langes Gedrückthalten auf dem Brett
  boardEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

     Buttons & Steuerung
